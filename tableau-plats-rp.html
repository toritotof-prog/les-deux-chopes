<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre culinaire — tableau de bord</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --iron-0:#0d1116;
  --iron-1:#151b22;
  --iron-2:#1c242e;
  --hearth:#c9973b;
  --hearth-dim:#8a6a2e;
  --parchment:#e9dfc2;
  --parchment-dim:#a89e82;
  --line:#3a4552;
  --sick:#7fa88a;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:
    radial-gradient(ellipse at 15% -10%, #24303c 0%, transparent 55%),
    radial-gradient(ellipse at 90% 5%, #241b16 0%, transparent 45%),
    var(--iron-0);
  color:var(--parchment);
  font-family:'EB Garamond', serif;
  min-height:100vh;
}

.wrap{max-width:960px;margin:0 auto;padding:44px 22px 70px;}

header{text-align:center;margin-bottom:36px;}
.eyebrow{
  font-family:'Cinzel',serif;
  letter-spacing:.32em;
  font-size:11px;
  color:var(--hearth-dim);
  text-transform:uppercase;
}
h1{
  font-family:'Cinzel',serif;
  font-weight:900;
  font-size:clamp(26px,4.5vw,38px);
  margin:8px 0 4px;
}
.subtitle{color:var(--parchment-dim);font-style:italic;font-size:15.5px;}
.rule{width:180px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--hearth-dim),transparent);}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;}
#search{
  flex:1;min-width:220px;
  font-family:'EB Garamond',serif;font-size:16px;
  padding:11px 14px;background:var(--iron-1);
  border:1px solid var(--line);color:var(--parchment);border-radius:2px;
}
#search::placeholder{color:var(--parchment-dim);font-style:italic;}
#search:focus{outline:none;border-color:var(--hearth-dim);}

select{
  font-family:'EB Garamond',serif;font-size:15px;
  padding:11px 12px;background:var(--iron-1);
  border:1px solid var(--line);color:var(--parchment);border-radius:2px;
}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chip{
  font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;border:1px solid var(--line);color:var(--parchment-dim);
  border-radius:2px;cursor:pointer;background:var(--iron-1);transition:all .15s ease;
}
.chip:hover{border-color:var(--hearth-dim);color:var(--parchment);}
.chip.active{background:var(--hearth-dim);border-color:var(--hearth);color:var(--iron-0);}

.count{font-size:13px;color:var(--parchment-dim);font-style:italic;margin-bottom:18px;}

/* cards */
.grid{display:grid;grid-template-columns:1fr;gap:12px;}
.card{
  background:var(--iron-1);border:1px solid var(--line);border-radius:2px;
  padding:18px 20px;transition:border-color .2s ease;
}
.card:hover{border-color:var(--hearth-dim);}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:19px;color:var(--parchment);}
.badge-heal{
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sick);border:1px solid var(--sick);padding:3px 9px;border-radius:2px;
}
.card-ing{font-size:13.5px;color:var(--hearth);margin-top:6px;font-style:italic;}
.card-desc{font-size:15px;color:var(--parchment);margin-top:10px;line-height:1.55;}
.card-benefit{
  font-size:13.5px;color:var(--parchment-dim);margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);
}
.card-benefit b{color:var(--frost, #7fa3b0);font-weight:600;}

.empty{text-align:center;padding:60px 20px;color:var(--parchment-dim);font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Registre culinaire de campagne</div>
    <h1>Tableau des plats</h1>
    <p class="subtitle">Recherchez par nom, ingrédient ou effet — filtrez les mets qui soignent.</p>
    <div class="rule"></div>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Chercher un plat, un ingrédient, un effet…">
    <select id="sort">
      <option value="name">Trier par nom</option>
      <option value="ing">Trier par ingrédient principal</option>
    </select>
  </div>

  <div class="chip-row" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Aucun plat ne correspond à cette recherche.</div>
</div>

<script>
const dishes = [
  {name:"Darne de Saumon", ing:"Viande de saumon, Tas de sel", desc:"Un grand classique des rivières, saisi rapidement au-dessus des flammes pour conserver sa tendreté.", benefit:"Restaure la santé mineure, soulage la faim rapidement.", heals:false},
  {name:"Bœuf cuit", ing:"Viande de bœuf, Tas de sel", desc:"Un morceau de viande roboratif, parfait pour redonner des forces après une marche.", benefit:"Restaure la santé, coupe-faim tenace.", heals:false},
  {name:"Pomme de terre cuite", ing:"Pomme de terre, Tas de sel", desc:"Simple, peu coûteux et tient bien au corps. L'aliment de base des paysans de Bordeciel.", benefit:"Restaure très peu de santé, repas très léger.", heals:false},
  {name:"Faisan / Lapin rôti", ing:"Faisan / Lapin, Tas de sel", desc:"Du petit gibier rôti à la broche. Une odeur qui attire les voyageurs à des lieues à la ronde.", benefit:"Restaure la santé mineure.", heals:false},
  {name:"Pain à l'ail", ing:"Pain, Ail, Beurre", desc:"Une tranche de pain grillée frottée à l'ail. Une spécialité simple qui réchauffe le cœur.", benefit:"Soin des maladies (très prisé en RP !), restaure un peu de santé.", heals:true}
];

let query = "";
let onlyHeals = false;
let sortMode = "name";

const chips = document.getElementById('chips');
const healChip = document.createElement('div');
healChip.className = 'chip';
healChip.textContent = 'Soigne les maladies';
healChip.onclick = () => { onlyHeals = !onlyHeals; healChip.classList.toggle('active'); render(); };
chips.appendChild(healChip);

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('sort').addEventListener('change', e=>{
  sortMode = e.target.value;
  render();
});

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  grid.innerHTML = '';

  let filtered = dishes.filter(d=>{
    const hay = (d.name+' '+d.ing+' '+d.desc+' '+d.benefit).toLowerCase();
    const matchesQuery = query === '' || hay.includes(query);
    const matchesHeal = !onlyHeals || d.heals;
    return matchesQuery && matchesHeal;
  });

  filtered.sort((a,b)=>{
    if(sortMode === 'ing') return a.ing.localeCompare(b.ing);
    return a.name.localeCompare(b.name);
  });

  count.textContent = filtered.length + (filtered.length > 1 ? ' plats trouvés' : ' plat trouvé');
  empty.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-name">${d.name}</div>
        ${d.heals ? '<div class="badge-heal">Soigne les maladies</div>' : ''}
      </div>
      <div class="card-ing">${d.ing}</div>
      <div class="card-desc">${d.desc}</div>
      <div class="card-benefit"><b>Bienfaits —</b> ${d.benefit}</div>
    `;
    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
